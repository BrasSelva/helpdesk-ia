name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore HelpdeskIA.slnx
      - run: dotnet build HelpdeskIA.slnx --no-restore --configuration Release
      - run: dotnet test HelpdeskIA.slnx --no-build --configuration Release

  web:
    name: Front React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  data:
    name: Données reproductibles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Régénérer les tickets et vérifier qu'ils n'ont pas changé
        run: |
          python scripts/generate_tickets.py
          git diff --exit-code data/
