services:
  # PostgreSQL avec l'extension pgvector : base métier et, à partir de la semaine 3, base vectorielle.
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Modèles en local (classification, embeddings, RAG). Démarré à partir de la semaine 2 :
  #   docker compose --profile ia up -d
  ollama:
    image: ollama/ollama
    profiles: ["ia"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
